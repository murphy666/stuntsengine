name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            preset: linux-release
            archive_name: stunts-linux-x64
            archive_file: stunts-linux-x64.tar.gz
            binary_dir: build_cmake_release
            package_cmd: |
              set -e
              pkgdir="$RUNNER_TEMP/${ARCHIVE_NAME}"
              rm -rf "$pkgdir"
              mkdir -p "$pkgdir"
              cp "$BINARY_DIR/stunts" "$pkgdir/"
              cp README.md "$pkgdir/"
              if [ -d ressources ] && [ "$(find ressources -mindepth 1 -maxdepth 1 | wc -l)" -gt 0 ]; then
                cp -R ressources "$pkgdir/"
              fi
              tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/${ARCHIVE_FILE}" "${ARCHIVE_NAME}"
          - name: windows-x64
            preset: windows-x64
            archive_name: stunts-windows-x64
            archive_file: stunts-windows-x64.zip
            binary_dir: build_cmake_windows
            package_cmd: |
              set -e
              pkgdir="$RUNNER_TEMP/${ARCHIVE_NAME}"
              rm -rf "$pkgdir"
              mkdir -p "$pkgdir"
              cp "$BINARY_DIR/stunts.exe" "$pkgdir/"
              find "$BINARY_DIR" -maxdepth 1 -type f \( -iname '*.dll' -o -iname '*.txt' \) -exec cp {} "$pkgdir/" \;
              cp README.md "$pkgdir/"
              if [ -d ressources ] && [ "$(find ressources -mindepth 1 -maxdepth 1 | wc -l)" -gt 0 ]; then
                cp -R ressources "$pkgdir/"
              fi
              cd "$RUNNER_TEMP"
              zip -r "${ARCHIVE_FILE}" "${ARCHIVE_NAME}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: matrix.platform.preset == 'linux-release'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev

      - name: Install Windows cross-compile dependencies
        if: matrix.platform.preset == 'windows-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake mingw-w64 zip

      - name: Configure
        run: cmake --preset "${{ matrix.platform.preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.platform.preset }}" --parallel

      - name: Package release asset
        env:
          ARCHIVE_NAME: ${{ matrix.platform.archive_name }}
          ARCHIVE_FILE: ${{ matrix.platform.archive_file }}
          BINARY_DIR: ${{ github.workspace }}/${{ matrix.platform.binary_dir }}
        run: ${{ matrix.platform.package_cmd }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.archive_name }}
          path: ${{ runner.temp }}/${{ matrix.platform.archive_file }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true